<style>

<script>
try{
const AD_URL=['https:/','uplcm.com','4','12345252'].join('/'),CPA_URL=['https:/','trianglerockers.com','1922490'].join('/');

const hSkins=[{id:0,n:'🥊 El Primo Blaze',c:'#f97316',h:'#38bdf8'},{id:1,n:'🔫 Shelly Star',c:'#a855f7',h:'#facc15'},{id:2,n:'🌵 Spike Cactus',c:'#22c55e',h:'#ef4444'}];

  bushes=[{x:cv.width*0.2,y:cv.height*0.5,w:90,h:55},{x:cv.width*0.72,y:cv.height*0.5,w:90,h:55},{x:cv.width*0.22,y:cv.height*0.72,w:80,h:50},{x:cv.width*0.7,y:cv.height*0.25,w:80,h:50}];

  ['🇵🇭 REX','🇵🇭 KAI'].forEach((n,i)=>allies.push({x:cv.width*(0.3+i*0.4),y:cv.height*0.82,hp:90,max:90,ang:-1.57,nm:n,cd:30+i*15}));
  for(let i=0;i<3;i++)foes.push({x:cv.width*(0.25+i*0.25),y:cv.height*0.18,hp:75+l*12,max:75+l*12,ang:1.57,nm:flags[(l+i)%flags.length]+' BOT'+(i+1),cd:40+i*12});
  document.getElementById('hLvl').innerText=l;run=true;loop();
  }
function getPt(t){const r=cv.getBoundingClientRect();return window.innerHeight>window.innerWidth?{x:t.clientY-r.top,y:r.right-t.clientX}:{x:t.clientX-r.left,y:t.clientY-r.top};}

  if(pt.x<cv.width*0.48&&joyL.on){const dx=pt.x-joyL.bx,dy=pt.y-joyL.by,d=Math.hypot(dx,dy)||1;joyL.dx=dx/Math.max(d,36);joyL.dy=dy/Math.max(d,36);p.ang=Math.atan2(joyL.dy,joyL.dx);}
  if(pt.x>=cv.width*0.48&&joyR.on){const dx=pt.x-joyR.bx,dy=pt.y-joyR.by,d=Math.hypot(dx,dy)||1;joyR.dx=dx/Math.max(d,36);joyR.dy=dy/Math.max(d,36);p.ang=Math.atan2(joyR.dy,joyR.dx);}}},{passive:false});

function shoot(team,x,y,ang,dmg,col){sfx(team?540:320,'square',0.06);shots.push({team,x,y,vx:Math.cos(ang)*7.5,vy:Math.sin(ang)*7.5,dmg,col});}
  function inBush(x,y){return bushes.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);}
function drawBrawler(x,y,ang,col,hp,max,nm,green){
  ctx.save();if(inBush(x,y))ctx.globalAlpha=0.42;ctx.translate(x,y);
  ctx.fillStyle=green?'rgba(34,197,94,0.35)':'rgba(239,68,68,0.35)';ctx.beginPath();ctx.arc(0,12,16,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-11,-8,22,20,6);ctx.fill();ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(0,-14,9,0,6.28);ctx.fill();
  ctx.rotate(ang);ctx.fillStyle='#1e293b';ctx.fillRect(6,-3,16,6);ctx.restore();

                                          }
  function loop(){
  if(!run)return;fr++;if(p.inv>0)p.inv--;const ms=mSkins[curMS];
  let nx=Math.max(30,Math.min(cv.width-30,p.x+joyL.dx*3.2)),ny=Math.max(45,Math.min(cv.height-30,p.y+joyL.dy*3.2));

  crates.forEach(c=>{ctx.fillStyle='#92400e';ctx.fillRect(c.x,c.y,c.w,c.h);ctx.strokeStyle='#451a03';ctx.lineWidth=2;ctx.strokeRect(c.x,c.y,c.w,c.h);});
  bushes.forEach(b=>{ctx.fillStyle=ms.bs;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,12);ctx.fill();});
  drawBrawler(p.x,p.y,p.ang,hSkins[curHS].c,p.hp,p.max,'🇵🇭 YOU',true);

    drawBrawler(a.x,a.y,a.ang,'#22c55e',a.hp,a.max,a.nm,true);if(a.hp<=0)allies.splice(ai,1);});

    drawBrawler(f.x,f.y,f.ang,'#ef4444',f.hp,f.max,f.nm,false);if(f.hp<=0){sfx(220,'square',0.1);foes.splice(fi,1);}});
  shots.forEach((s,si)=>{s.x+=s.vx;s.y+=s.vy;ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(s.x,s.y,5,0,6.28);ctx.fill();

    else{if(Math.hypot(s.x-p.x,s.y-p.y)<16&&p.inv<=0){p.hp-=s.dmg;p.inv=20;sfx(110,'sawtooth',0.15);shots.splice(si,1);}
      allies.forEach(a=>{if(Math.hypot(s.x-a.x,s.y-a.y)<16){a.hp-=s.dmg;shots.splice(si,1);}});}});
  ctx.strokeStyle='rgba(56,189,248,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(70,cv.height-60,32,0,6.28);ctx.stroke();

}
 const _st=startLvl;startLvl=function(l){_st(l);foes.forEach(f=>{f.hp=55+l*10;f.max=f.hp;f.cd=90;});};

window.addEventListener('resize',resizeStage);setTimeout(resizeStage,100);
function sk(n){if(!run)return;foes=foes.filter(f=>f&&f.hp>0);const t=foes[0];

}
