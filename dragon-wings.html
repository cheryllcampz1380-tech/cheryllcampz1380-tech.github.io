<html>
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;background:#040c08;color:#fff;font-family:sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}

.hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10;text-shadow:0 2px 4px #000}
.hud-l{display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:bold;font-size:15px}

.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.pill{background:rgba(0,0,0,0.65);border:1px solid #22c55e;color:#fff;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:12px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(4,12,8,0.95);z-index:20;overflow-y:auto;padding:15px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:12px auto}
.lvl{padding:12px 4px;border-radius:10px;font-weight:bold;border:1px solid #22c55e;background:#0a2618;color:#fff;cursor:pointer}
.lvl.lock{background:#111827;border-color:#374151;color:#6b7280}
.skin-card{display:inline-block;width:45%;margin:5px;padding:10px;border-radius:12px;border:2px solid #374151;background:#091c12;cursor:pointer}
.skin-card.act{border-color:#22c55e;box-shadow:0 0 12px rgba(34,197,94,0.5)}
</style></head><body>
<div class="hud">

    <div>❤️ x<span id="hLives">4</span></div>
    <div class="w-badge">🟢</div>
    <div>Lv. <span id="hWlv">1</span></div>
  </div>
  <div class="hud-r">
        <div style="font-size:18px;font-weight:bold;color:#fbbf24">🪙 <span id="hCoins">0</span></div>

    <button class="pill" onclick="openSkins()">🎨 SKINS (AD)</button>
    <button class="pill" style="border-color:#f59e0b;color:#fbbf24" onclick="window.open('https://trianglerockers.com');localStorage.setItem('wcb_pts',parseInt(localStorage.getItem('wcb_pts')||'0')+1000);alert('🎁 +1,000 PTS Offerwall Bonus!')">🎁 +1K PTS</button>
  </div>
</div>
<canvas id="cv"></canvas>
<div class="modal" id="lvlModal">
  <div style="display:flex;justify-content:space-between;align-items:center"><button class="pill" onclick="location.href='index.html'">⬅ LOBBY</button><button class="pill" onclick="openSkins()">🎨 DRAGON & MAP SKINS</button></div>
  <h2 style="color:#22c55e;margin:10px 0 4px">🐉 DRAGON WINGS ARCADE</h2>
    <p style="font-size:12px;color:#9ca3af">Unlocked: 1–<span id="maxUnl">4</span> | High-Altitude Forest Flight</p>
  <div style="margin:8px 0"><button class="pill" onclick="changePage(-1)">◀ PREV 50</button> <b id="pgLbl">1 - 50</b> <button class="pill" onclick="changePage(1)">NEXT 50 ▶</button></div>
  <div class="grid" id="lvlGrid"></div>
</div>
<div class="modal" id="skinModal" style="display:none">
  <h2 style="color:#fbbf24;margin-bottom:4px">🎨 DRAGON & FOREST SKINS</h2>
  <p style="font-size:12px;color:#9ca3af;margin-bottom:10px">Watch a quick Sponsored Ad to equip any Skin!</p>
  <div id="skinList"></div>
  <button class="pill" style="margin-top:14px;padding:10px 24px;background:#22c55e;color:#000" onclick="document.getElementById('skinModal').style.display='none'">✔ DONE</button>
</div>
<script>
try{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}resize();window.onresize=resize;
let snd=localStorage.getItem('dw_snd')!=='0',actx=null;
function toggleSnd(){snd=!snd;localStorage.setItem('dw_snd',snd?'1':'0');document.getElementById('sndBtn').innerText=snd?'🔊 SOUND: ON':'🔇 SOUND: OFF';}
function sfx(f,t='sine',d=0.08){if(!snd)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
const dSkins=[{id:0,n:'🐉 Emerald Viper',c:'#22c55e',b:'#4ade80'},{id:1,n:'🔥 Crimson Blaze',c:'#ef4444',b:'#fb923c'},{id:2,n:'⚡ Cyber Storm',c:'#06b6d4',b:'#38bdf8'},{id:3,n:'👑 Golden Emperor',c:'#eab308',b:'#fde047'}];
const bSkins=[{id:0,n:'🌲 Deep Emerald Forest',g:'#082012',t:'#0d331d',r:'#1e293b'},{id:1,n:'🍂 Autumn Canyon Woods',g:'#271508',t:'#45220c',r:'#33261d'},{id:2,n:'🌌 Mystic Night Forest',g:'#071324',t:'#0f2647',r:'#1e293b'}];

  function openSkins(){
  const box=document.getElementById('skinList');box.innerHTML='<h4 style="color:#4ade80;margin:6px 0">Dragon Skins</h4>';
  dSkins.forEach(s=>{box.innerHTML+=`<div class="skin-card ${curDS===s.id?'act':''}" onclick="pickSkin('d',${s.id})">${s.n}<br><small>${curDS===s.id?'EQUIPPED':'🎬 AD TO EQUIP'}</small></div>`;});

  bSkins.forEach(s=>{box.innerHTML+=`<div class="skin-card ${curBS===s.id?'act':''}" onclick="pickSkin('b',${s.id})">${s.n}<br><small>${curBS===s.id?'EQUIPPED':'🎬 AD TO EQUIP'}</small></div>`;});

  let unl=Math.max(4,parseInt(localStorage.getItem('dw_unl')||'4')),pg=0,curLvl=1;

  document.getElementById('maxUnl').innerText=unl;
  const s=pg*50+1,e=Math.min(1000,s+49),g=document.getElementById('lvlGrid');

    const b=document.createElement('button');b.className='lvl'+(i>unl?' lock':'');
    b.innerHTML=i>unl?'🔒<br>'+i:(i%5===0?'👹<br>'+i:'🐉<br>'+i);
    b.onclick=()=>{if(i<=unl)startLvl(i);else alert('Clear Level '+(i-1)+' first!');};g.appendChild(b);
  }
}
  function changePage(d){pg=Math.max(0,Math.min(19,pg+d));renderGrid();}
let p={x:200,y:500,lives:4,wlv:1,inv:0},wave=1,kills=0,coins=0,run=false,fr=0,bossWarn=0;
let shots=[],ebul=[],foes=[],drops=[],boss=null;
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches;p.x=Math.max(25,Math.min(cv.width-25,t.clientX));p.y=Math.max(80,Math.min(cv.height-60,t.clientY-35));},{passive:false});
cv.addEventListener('mousemove',e=>{if(e.buttons){p.x=Math.max(25,Math.min(cv.width-25,e.clientX));p.y=Math.max(80,Math.min(cv.height-60,e.clientY-35));}});
function startLvl(l){
  curLvl=l;p={x:cv.width/2,y:cv.height*0.72,lives:4,wlv:1,inv:60};wave=1;kills=0;coins=0;fr=0;bossWarn=0;
  shots=[];ebul=[];foes=[];drops=[];boss=null;document.getElementById('lvlModal').style.display='none';
  document.getElementById('hLvl').innerText=l;document.getElementById('sndBtn').innerText=snd?'🔊 SOUND: ON':'🔇 SOUND: OFF';
  run=true;loop();
}
  function drawForest(){
  const bs=bSkins[curBS],sp=(fr*1.4)%120;ctx.fillStyle=bs.g;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle=bs.r;ctx.lineWidth=34;ctx.beginPath();
  for(let y=-120;y<cv.height+120;y+=20){const wy=y+sp,wx=cv.width/2+Math.sin((wy+fr*1.4)*0.008)*95;y===-120?ctx.moveTo(wx,wy):ctx.lineTo(wx,wy);}
  ctx.stroke();ctx.fillStyle=bs.t;
  for(let y=-120;y<cv.height+120;y+=60){for(let x=15;x<cv.width;x+=55){
    const rx=cv.width/2+Math.sin((y+sp+fr*1.4)*0.008)*95;if(Math.abs(x-rx)>42){ctx.beginPath();ctx.arc(x,y+sp,24,0,6.28);ctx.fill();}
  }}
}
function drawDragon(){
    const ds=dSkins[curDS],fl=Math.sin(fr*0.2)*8;ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle=ds.c;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-34,-2+fl);ctx.lineTo(-16,12);ctx.lineTo(0,28);ctx.lineTo(16,12);ctx.lineTo(34,-2+fl);ctx.closePath();ctx.fill();
  ctx.strokeStyle=ds.b;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,22,0,6.28);ctx.stroke();ctx.restore();
}
function spawnWave(){
  if(fr%16===0){sfx(520,'triangle',0.05);const n=Math.min(7,p.wlv+1);
  for(let i=0;i<n;i++){const off=(i-(n-1)/2);shots.push({x:p.x+off*11,y:p.y-20-Math.abs(off)*4,vx:off*0.5,vy:-9,c:dSkins[curDS].b});}}
  if(wave<6&&fr%75===0)foes.push({x:40+Math.random()*(cv.width-80),y:-25,hp:22+curLvl*4,max:22+curLvl*4,vy:1.4+Math.min(2,curLvl*0.02)});
  if(wave===6&&!boss&&bossWarn===0){bossWarn=120;sfx(180,'sawtooth',0.4);}
}
  function loop(){
  if(!run)return;fr++;if(p.inv>0)p.inv--;drawForest();spawnWave();drawDragon();
  if(bossWarn>0){
    bossWarn--;ctx.fillStyle='rgba(220,38,38,0.35)';ctx.fillRect(0,0,22,cv.height);ctx.fillRect(cv.width-22,0,22,cv.height);
    ctx.fillStyle='#fbbf24';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('⚠️ BOSS INCOMING ⚠️',cv.width/2,160);
    if(bossWarn===0)boss={name:'GOAT O\' WAR',x:cv.width/2,y:110,hp:280+curLvl*45,max:280+curLvl*45,dir:1.5};
  }
  shots.forEach((s,i)=>{s.x+=s.vx;s.y+=s.vy;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,4,0,6.28);ctx.fill();if(s.y<0)shots.splice(i,1);});
  foes.forEach((f,fi)=>{
    f.y+=f.vy;ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🦇',f.x,f.y);
        ctx.fillStyle='#22c55e';ctx.fillRect(f.x-15,f.y+10,30*(f.hp/f.max),4);
    if(fr%110===0)ebul.push({x:f.x,y:f.y,vx:0,vy:2.6});
    shots.forEach((s,si)=>{if(Math.hypot(s.x-f.x,s.y-f.y)<24){f.hp-=12+p.wlv*4;shots.splice(si,1);}});
    if(f.hp<=0){sfx(240,'square',0.08);kills++;coins+=5;if(kills%6===0&&wave<6)wave++;
      if(Math.random()<0.35)drops.push({x:f.x,y:f.y,t:Math.random()<0.3?'w':'c'});foes.splice(fi,1);}
    if(Math.hypot(f.x-p.x,f.y-p.y)<24&&p.inv<=0){p.lives--;p.inv=80;sfx(120,'sawtooth',0.2);foes.splice(fi,1);}
  });
  drops.forEach((d,di)=>{d.y+=1.8;ctx.font='22px serif';ctx.fillText(d.t==='w'?'🟢':'🪙',d.x,d.y);
    if(Math.hypot(d.x-p.x,d.y-p.y)<26){sfx(780,'sine',0.1);if(d.t==='w')p.wlv=Math.min(5,p.wlv+1);else coins+=10;drops.splice(di,1);}});
  if(boss){boss.x+=boss.dir;if(boss.x<50||boss.x>cv.width-50)boss.dir*=-1;ctx.fillStyle='#ef4444';ctx.fillRect(40,65,(cv.width-80)*(boss.hp/boss.max),8);
          ctx.font='48px serif';ctx.fillText('👹',boss.x,boss.y);if(fr%75===0)for(let a=0;a<6.28;a+=0.78)ebul.push({x:boss.x,y:boss.y,vx:Math.cos(a)*2.3,vy:Math.sin(a)*2.3});
    shots.forEach((s,si)=>{if(Math.hypot(s.x-boss.x,s.y-boss.y)<36){boss.hp-=12+p.wlv*4;shots.splice(si,1);}});if(boss.hp<=0){coins+=50;winLvl();}
  }
  ebul.forEach((b,bi)=>{b.x+=b.vx;b.y+=b.vy;ctx.fillStyle='#e879f9';ctx.beginPath();ctx.arc(b.x,b.y,6,0,6.28);ctx.fill();
    if(Math.hypot(b.x-p.x,b.y-p.y)<18&&p.inv<=0){p.lives--;p.inv=80;sfx(120,'sawtooth',0.2);ebul.splice(bi,1);}});
  document.getElementById('hWave').innerText=wave;document.getElementById('hLives').innerText=Math.max(0,p.lives);document.getElementById('hWlv').innerText=p.wlv;document.getElementById('hCoins').innerText=coins;
  if(p.lives<=0){run=false;window.open('https://uplcm.com/4/12345252');alert('💀 GAME OVER! Coins: '+coins);document.getElementById('lvlModal').style.display='block';}
  else if(run)requestAnimationFrame(loop);
}
function winLvl(){run=false;sfx(880,'triangle',0.3);if(curLvl===unl&&unl<1000){unl++;localStorage.setItem('dw_unl',unl);}
  const pts=curLvl*50+kills*10;localStorage.setItem('wcb_pts',parseInt(localStorage.getItem('wcb_pts')||'0')+pts);localStorage.setItem('wcb_coins',parseInt(localStorage.getItem('wcb_coins')||'0')+coins);
  window.open('https://uplcm.com/4/12345252');alert('🔶 VICTORY! ⭐⭐⭐\nEliminated: '+kills+' Enemies\n+'+pts+' PTS & +'+coins+' Coins Added!');renderGrid();document.getElementById('lvlModal').style.display='block';}
function resize(){cv.width=document.documentElement.clientWidth;cv.height=document.documentElement.clientHeight;}resize();
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches;p.x=Math.max(28,Math.min(cv.width-28,t.clientX));p.y=Math.max(90,Math.min(cv.height*0.8,t.clientY-45));},{passive:false});
const _st2=startLvl;startLvl=function(l){let pt=parseInt(localStorage.getItem('wcb_pts')||'0');
if(l===1&&pt<0){if(!confirm('⚠️ Not enough PTS! Watch Sponsored Ad to unlock Free Play?'))return;window.open('https://uplcm.com');localStorage.setItem('wcb_pts','0');}
_st2(l);p.y=cv.height*0.62;p.inv=15;};
setInterval(()=>{if(run){ebul.forEach(b=>{b.y+=1.5;});foes.forEach(f=>{if(Math.hypot(f.x-p.x,f.y-p.y)<26&&p.inv<=0){p.lives--;p.inv=40;sfx(100,'sawtooth',0.25);}});
if(p.lives<=0&&run){run=false;localStorage.setItem('wcb_pts',parseInt(localStorage.getItem('wcb_pts')||'0')-100);
window.open('https://uplcm.com/4/12345252');alert('💀 DEFEATED! You got hit!\n-100 PTS Penalty & Back to Level 1!\nWatch Ad to continue playing.');
document.getElementById('lvlModal').style.display='block';}}},100);
  cv.style.cssText='display:block;margin:65px auto 0;width:94%;max-width:410px;height:78vh;border:2px solid #22c55e;border-radius:14px';
function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;}resize();
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),t=e.touches;
p.x=Math.max(25,Math.min(cv.width-25,t.clientX-r.left));p.y=Math.max(40,Math.min(cv.height-35,t.clientY-r.top));},{passive:false});
  setInterval(()=>{if(isNaN(p.x)||isNaN(p.y)){p.x=cv.width/2;p.y=cv.height*0.72;}},30);
cv.ontouchstart=cv.ontouchmove=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),t=e.touches[0];
p.x=Math.max(25,Math.min(cv.width-25,t.clientX-r.left));p.y=Math.max(40,Math.min(cv.height-35,t.clientY-r.top));};
  renderGrid();}catch(e){console.error(e);}</script></body></html>
