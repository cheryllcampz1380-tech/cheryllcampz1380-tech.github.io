<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Wings 14+ | World Country Battle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#040814;color:#fff;font-family:sans-serif;overflow:hidden;text-align:center}
canvas{display:block;margin:0 auto;background:linear-gradient(#06122b,#0b2559);border-x:3px solid #00f0ff;box-shadow:0 0 25px #00f0ff}
.ui{position:fixed;top:0;left:0;width:100%;padding:8px;display:flex;justify-content:space-between;background:rgba(4,8,20,0.85);border-bottom:1px solid #00f0ff;z-index:10}
  .modal{position:fixed;inset:0;background:rgba(4,8,20,0.96);z-index:20;overflow-y:auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:15px auto}
.lvl{padding:12px 4px;border-radius:8px;font-weight:bold;border:1px solid #00f0ff;background:#0b2559;color:#fff;cursor:pointer}
.lvl.lock{background:#111827;border-color:#374151;color:#6b7280;cursor:not-allowed}
.lvl.boss{border-color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,0.4)}
.skills{position:fixed;bottom:15px;left:0;width:100%;display:flex;justify-content:center;gap:10px;z-index:10}
.sbtn{padding:10px 14px;border-radius:50px;border:2px solid #00f0ff;background:#06122b;color:#fff;font-weight:bold;font-size:12px}
.sbtn:disabled{opacity:0.4;border-color:#555}
.btn{padding:10px 18px;border-radius:8px;border:none;background:#00f0ff;color:#040814;font-weight:bold;cursor:pointer}
</style></head><body>
  <div class="ui">
  <button class="btn" onclick="location.href='index.html'">⬅ LOBBY</button>
  <div>LVL <b id="hudLvl">1</b> | ❤️ <b id="hudHp">100</b></div>
  <div>PTS: <b id="hudPts">0</b></div>
</div>
<canvas id="cv"></canvas>
<div class="skills">
  <button class="sbtn" id="skFire" onclick="useSkill('fire')">🔥 FIRE</button>
  <button class="sbtn" id="skIce" onclick="useSkill('ice')">❄️ ICE</button>
  <button class="sbtn" id="skBomb" onclick="useSkill('bomb')">💥 SPIRIT</button>
    <button class="sbtn" id="skDash" onclick="useSkill('dash')">💨 DASH</button>
</div>
<div class="modal" id="lvlModal">
  <h2 style="color:#00f0ff;margin-top:10px">🐉 DRAGON WINGS (14+)</h2>
  <p style="font-size:13px;color:#9ca3af;margin:6px 0">Unlocked: 1–<span id="maxUnl">4</span> | Boss Every 5 Levels</p>
  <div style="margin:10px 0"><button class="btn" onclick="changePage(-1)">◀ PREV 50</button> <b id="pgLbl">1 - 50</b> <button class="btn" onclick="changePage(1)">NEXT 50 ▶</button></div>
  <div class="grid" id="lvlGrid"></div>
</div>
<script>
try{
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=Math.min(window.innerWidth,420);cv.height=window.innerHeight;
let unl=Math.max(4,parseInt(localStorage.getItem('dw_unl')||'4')),pg=0,curLvl=1;
function renderGrid(){
  document.getElementById('maxUnl').innerText=unl;
  const s=pg*50+1,e=Math.min(1000,s+49),g=document.getElementById('lvlGrid');
  document.getElementById('pgLbl').innerText=s+' - '+e;g.innerHTML='';
  for(let i=s;i<=e;i++){
    const b=document.createElement('button');
    b.className='lvl'+(i>unl?' lock':'')+(i%5===0?' boss':'');
        b.innerHTML=i>unl?'🔒<br>'+i:(i%5===0?'👹<br>'+i:'🐉<br>'+i);
    b.onclick=()=>{if(i<=unl)startLvl(i);else alert('Clear Level '+(i-1)+' first!');};
    g.appendChild(b);
  }
}
function changePage(d){pg=Math.max(0,Math.min(19,pg+d));renderGrid();}
let p={x:200,y:500,hp:100,w:1,inv:0,ice:0},pts=0,run=false,fr=0;
let shots=[],ebul=[],foes=[],pups=[],boss=null;
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();p.x=Math.max(20,Math.min(cv.width-20,e.touches[0].clientX-r.left));p.y=Math.max(80,Math.min(cv.height-80,e.touches[0].clientY-r.top));},{passive:false});
cv.addEventListener('mousemove',e=>{if(e.buttons){const r=cv.getBoundingClientRect();p.x=Math.max(20,Math.min(cv.width-20,e.clientX-r.left));}});
  let joy={on:false,bx:75,by:cv.height-95,dx:0,dy:0};
cv.addEventListener('touchstart',e=>{const t=e.touches,r=cv.getBoundingClientRect();if(Math.hypot(t.clientX-r.left-joy.bx,t.clientY-r.top-joy.by)<65)joy.on=true;});
cv.addEventListener('touchend',()=>{joy.on=false;joy.dx=0;joy.dy=0;});
function startLvl(l){
  curLvl=l;p={x:cv.width/2,y:cv.height-110,hp:100,w:1,inv:0,ice:0};pts=0;shots=[];ebul=[];foes=[];pups=[];
  document.getElementById('lvlModal').style.display='none';document.getElementById('hudLvl').innerText=l;
  const bNames=['🐝 BEE HIVE QUEEN','👹 VOID DEMON','🔥 INFERNO PHOENIX'];
  boss=l%5===0?{name:bNames[(l/5)%3|0],x:cv.width/2,y:95,hp:250+l*40,max:250+l*40,dir:2}:null;
  run=true;loop();
  }
  cv.addEventListener('touchmove',e=>{if(joy.on){const t=e.touches,r=cv.getBoundingClientRect(),dx=t.clientX-r.left-joy.bx,dy=t.clientY-r.top-joy.by,d=Math.hypot(dx,dy)||1;joy.dx=dx/Math.max(d,45);joy.dy=dy/Math.max(d,45);}},{passive:false});
function useSkill(s){
  if(!run)return;
  if(s==='fire')for(let a=-2;a<=2;a++)shots.push({x:p.x,y:p.y-20,vx:a*2.5,vy:-11,dmg:35,c:'#ff4500',r:7});
  if(s==='ice'){p.ice=180;ebul=[];}
  if(s==='bomb'){foes=[];ebul=[];if(boss)boss.hp-=120;pts+=50;}
  if(s==='dash'){p.inv=90;p.y=Math.max(120,p.y-70);}
}
function spawnWave(){
  if(!boss&&fr%45===0)foes.push({x:35+Math.random()*(cv.width-70),y:-20,hp:20+curLvl*4,vy:2+Math.min(4,curLvl*0.05)});
  
  if(fr%10===0)for(let i=0;i<p.w;i++)shots.push({x:p.x+(i-(p.w-1)/2)*12,y:p.y-22,vx:0,vy:-12,dmg:15+p.w*5,c:'#00f0ff',r:4});
  if(boss&&fr%55===0)for(let a=0;a<6.28;a+=0.6)ebul.push({x:boss.x,y:boss.y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2});
}
function drawBg(){
  ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='rgba(0,240,255,0.25)';ctx.lineWidth=2;
  for(let y=(fr*4)%40;y<cv.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}
  ctx.beginPath();ctx.arc(joy.bx,joy.by,45,0,6.28);ctx.strokeStyle='rgba(0,240,255,0.4)';ctx.stroke();
  ctx.beginPath();ctx.arc(joy.bx+joy.dx*45,joy.by+joy.dy*45,20,0,6.28);ctx.fillStyle='rgba(0,240,255,0.6)';ctx.fill();
}
function loop(){
    if(!run)return;fr++;if(p.inv>0)p.inv--;if(p.ice>0)p.ice--;
  p.x=Math.max(25,Math.min(cv.width-25,p.x+joy.dx*6));p.y=Math.max(80,Math.min(cv.height-85,p.y+joy.dy*6));
  spawnWave();drawBg();ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('🐉',p.x,p.y);
  shots.forEach((s,i)=>{s.x+=s.vx;s.y+=s.vy;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();if(s.y<0)shots.splice(i,1);});
  if(boss){
    boss.x+=boss.dir;if(boss.x<45||boss.x>cv.width-45)boss.dir*=-1;
    ctx.fillStyle='#ef4444';ctx.fillRect(40,52,(cv.width-80)*(boss.hp/boss.max),8);
    ctx.font='46px serif';ctx.fillText(boss.name.split(' '),boss.x,boss.y);
    shots.forEach((s,si)=>{if(Math.hypot(s.x-boss.x,s.y-boss.y)<35){boss.hp-=s.dmg;shots.splice(si,1);}});
      if(boss.hp<=0){pts+=300+curLvl*20;winLvl();}
  }
  foes.forEach((f,fi)=>{
    f.y+=p.ice>0?f.vy*0.3:f.vy;ctx.font='28px serif';ctx.fillText('🦇',f.x,f.y);
    if(fr%70===0)ebul.push({x:f.x,y:f.y,vx:0,vy:4});
    shots.forEach((s,si)=>{if(Math.hypot(s.x-f.x,s.y-f.y)<24){f.hp-=s.dmg;shots.splice(si,1);}});
    if(f.hp<=0){pts+=20+curLvl;if(Math.random()<0.25)pups.push({x:f.x,y:f.y});foes.splice(fi,1);}
    if(Math.hypot(f.x-p.x,f.y-p.y)<24&&p.inv<=0){p.hp-=20;foes.splice(fi,1);}
  });
  pups.forEach((u,ui)=>{u.y+=2.5;ctx.font='24px serif';ctx.fillText('⚡',u.x,u.y);if(Math.hypot(u.x-p.x,u.y-p.y)<26){p.w=Math.min(4,p.w+1);pts+=50;pups.splice(ui,1);}});
  ebul.forEach((b,bi)=>{b.x+=b.vx;b.y+=b.vy;ctx.fillStyle='#ff2a6d';ctx.beginPath();ctx.arc(b.x,b.y,6,0,6.28);ctx.fill();if(Math.hypot(b.x-p.x,b.y-p.y)<18&&p.inv<=0){p.hp-=15;ebul.splice(bi,1);}});
  document.getElementById('hudHp').innerText=Math.max(0,p.hp);document.getElementById('hudPts').innerText=pts;
  if(!boss&&pts>=(curLvl*150))winLvl();
  if(p.hp<=0){run=false;alert('💀 DRAGON DOWN! Score: '+pts);document.getElementById('lvlModal').style.display='block';}
  else if(run)requestAnimationFrame(loop);
}
function winLvl(){
  run=false;if(curLvl===unl&&unl<1000){unl++;localStorage.setItem('dw_unl',unl);}
  const earnPts=pts+(curLvl*25),earnCoins=10+Math.floor(curLvl/2);
  localStorage.setItem('wcb_pts',parseInt(localStorage.getItem('wcb_pts')||'0')+earnPts);
  localStorage.setItem('wcb_coins',parseInt(localStorage.getItem('wcb_coins')||'0')+earnCoins);
  alert('🏆 LEVEL '+curLvl+' CLEARED!\n+'+earnPts+' PTS & +'+earnCoins+' Coins added to Wallet!');
  renderGrid();document.getElementById('lvlModal').style.display='block';
}
  (function(s){s.dataset.zone='12339774',s.src='https://nap5k.com'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
document.querySelector('.skills').insertAdjacentHTML('afterbegin','<button class="sbtn" onclick="if(run){foes.forEach(f=>f.y-=90);ebul=[];}">🌪️ WIND</button>');
document.querySelector('.ui').insertAdjacentHTML('beforeend','<button class="btn" style="background:#f59e0b" onclick="window.open(\'https://trianglerockers.com\',\'_blank\');localStorage.setItem(\'wcb_pts\',parseInt(localStorage.getItem(\'wcb_pts\')||\'0\')+1000);alert(\'🎁 +1,000 PTS Offerwall Bonus!\')">🎁 +1K</button>');
const _st=startLvl;startLvl=function(l){window.open('https://uplcm.com');_st(l);};
const _ow=winLvl;winLvl=function(){_ow();window.open('https://uplcm.com');
if(curLvl%5===0){const drop=curLvl%10===0?'🌟 LEGENDARY DROP (+500 Coins)':'💎 RARE DROP (+200 Coins)';
localStorage.setItem('wcb_coins',parseInt(localStorage.getItem('wcb_coins')||'0')+(curLvl%10===0?500:200));
alert('🏆 TROPHY ROAD MILESTONE!\nUnlocked: '+drop+' & +50 Power Points!');}};
  
renderGrid();
}catch(e){console.error(e);}
</script></body></html>
